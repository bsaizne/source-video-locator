# H3 macOS Apple Silicon (PyTorch MPS) feasibility POC — GitHub Actions CI.
#
# Runs on a real macOS ARM64 (Apple Silicon) hosted runner and compares CPU vs MPS
# on the frozen DINOv2 ViT-S/14 model. Manual-only (workflow_dispatch) so it does
# not consume macOS runners on every push. See mvp/poc/macos_mps/README.md.
#
# NOTE (reindex): this file lives on the default branch (master). If GitHub
# Actions has not listed it yet, this push forces a fresh index scan.
#
# - Verifies `uname -m = arm64` (real Apple Silicon, not Intel).
# - Installs a macOS PyTorch wheel (arm64, with MPS) — NOT the Windows CPU build.
# - App/Bench never run the full 2.mkv here; only fixed test frames 3/8/32/128/500.
# - Download + verify the DINOv2 weight (size/sha256); MODEL_DOWNLOAD_BLOCKED is
#   reported honestly if the network blocks it — no faked pass.
# - Uploads results.json + results.md as a workflow artifact.

name: H3 macOS MPS POC + MVP tests

on:
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"

jobs:
  # ---- H3 适配主验证: mvp 全套单测在 macOS (MPS 可用) 上跑 ----
  # - 与 POC job 并行; 权重复用同一缓存目录。
  # - DML/onnxruntime 用例在 macOS 自动 skip（test_directml_backend B 类守护）。
  # - B 类 MPS 实机用例（test_mps_backend BClassTests）在此真正执行。
  mvp-tests-macos:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "arm64"

      - name: Cache pip + DINOv2 weights
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/pip
            ${{ github.workspace }}/.cache/dinov2_weights
          key: h3-mps-cache-v1

      - name: Install deps (PyTorch w/ MPS, opencv, numpy)
        run: |
          python -m pip install --upgrade pip
          pip install torch numpy opencv-python
          python -c "import torch; print('torch', torch.__version__, 'mps_avail', torch.backends.mps.is_available())"

      - name: Download DINOv2 weights (same cache as POC)
        run: |
          mkdir -p .cache/dinov2_weights
          W=.cache/dinov2_weights/dinov2_vits14_pretrain.pth
          if [ ! -f "$W" ]; then
            curl -fL --retry 3 -o "$W" "https://dl.fbaipublicfiles.com/dinov2/dinov2_vits14/dinov2_vits14_pretrain.pth"
          fi
          ls -la "$W"

      - name: Run mvp unit tests (259+; DML 类自动 skip, MPS 类真跑)
        env:
          SVL_DINOV2_WEIGHTS: ${{ github.workspace }}/.cache/dinov2_weights/dinov2_vits14_pretrain.pth
          PYTHONUNBUFFERED: "1"
        run: |
          python -m unittest discover -s mvp/tests -t . -v 2>&1 | tee mvp_test_macos.log
          exit ${PIPESTATUS[0]}

      - name: MPS backend smoke (shape/L2/batch cap)
        env:
          SVL_DINOV2_WEIGHTS: ${{ github.workspace }}/.cache/dinov2_weights/dinov2_vits14_pretrain.pth
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "mvp/src")
          import numpy as np
          from device import MPSBackend, mps_available
          assert mps_available()[0], "MPS must be available on this runner"
          be = MPSBackend(batch_size=4)
          frames = [np.random.RandomState(i).randint(0, 255, (32, 32, 3), dtype=np.uint8) for i in range(9)]
          feats = be.embed_frames(frames)
          assert feats.shape == (9, 384) and feats.dtype == np.float32
          assert abs(float(np.linalg.norm(feats, axis=1).mean()) - 1.0) < 1e-4
          print("MPS smoke OK:", feats.shape, feats.dtype)
          PY

      - name: Upload test log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp-macos-test-log
          path: mvp_test_macos.log
          if-no-files-found: error

  # ---- 以下为原 POC job ----
  # ---- mac 安装包（unsigned zip）: 测试绿了才打包 ----
  # PyInstaller 打 mac arm64 后端（MPS）+ DINOv2 权重随包 + electron-builder zip。
  # 未签名: 下载后需 `xattr -cr Video\ Locator.app`（或右键打开）绕过 Gatekeeper。
  macos-package:
    needs: mvp-tests-macos
    runs-on: macos-15
    permissions:
      contents: write   # gh release 上传安装包
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "arm64"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache pip + weights
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/pip
            ${{ github.workspace }}/.cache/dinov2_weights
          key: h3-mps-cache-v1

      - name: Install backend build deps
        run: |
          python -m pip install --upgrade pip
          pip install torch numpy opencv-python fastapi uvicorn pyinstaller rapidocr-onnxruntime static-ffmpeg pyJianYingDraft

      - name: Fetch model assets for mac bundle (patch + ISC ONNX)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          M=mvp/ui/resources/models
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          TAGURL="https://github.com/$GITHUB_REPOSITORY/releases/download/model-assets"
          # `-4` 与 `--http1.1` 都是**待验证假设**（不是已证结论）：连红三轮的都是同一发
          # `api.github.com` 元数据请求，IPv6 路由与 HTTP/2 复位是两类最常见、且「换客户端实现也
          # 救不回来」的成因；下面 ch1~ch4 各通道独立，失败时把 -6/-4 对照也打进注解。
          CUR="curl -sfL -4 --http1.1 --retry 3 --retry-delay 5 --retry-all-errors --retry-connrefused"
          # 为什么长这样（只写有证据的部分）：这一步 2026-10-08 连红三轮，全部是 `api.github.com`
          # 那一发 `curl rc=56`（recv failure）：
          #   run 37791429326（head b6a4a25，元数据无重试）→ 56
          #   run 37795700737（head cf4b61f，元数据已带 --retry 5 + 整发 3 次 + size 等值校验）→ 还是 56，
          #     且该 job 的 check annotations 里**我上一轮加的 ::warning:: 一条都没出现**
          #     ⇒ 死在元数据那一发（`json="$(curl …)"` 在 set -e 下直接判死整步），没走到下载循环
          #     ⇒ 同一发请求 6 次尝试全同码 ⇒ 不是抖动；而同一步 2026-10-06（run 37471104792）是绿的。
          # 本机取 job 日志要令牌（403），能观测的只有 annotations ⇒ 这一版把**每条通道的失败原因
          # （rc / http_code / stderr 头）都打进注解**，并把「元数据拿不到」与「资产拿不到」**解耦**：
          #   元数据四条独立入口 —— api/tags、api/list（draft release 用列表端点更稳）、
          #     各自再配 curl(`-4 --http1.1`) 与 `gh api`（Go 客户端，独立实现）；
          #   资产三条通道 —— A=api octet-stream by id、B=gh api by id、C=github.com 直链。
          # **元数据全灭不再等于整步死**：改走「直链 + 仓库里 asset.json 的 sha256 当场比对」，
          # 那条路一个字都不碰 api.github.com ⇒ 今天这种「api 不通」也能出包。
          # 出口码分档可判位：90=元数据四通道全灭**且**直链兜底也没补齐 / 91=有元数据但资产三通道×3 轮
          # 仍不齐 / 最后的 verify_model_asset_shas 原样兜底。
          note() { echo "::notice::$*"; }
          warn() { echo "::warning::$*"; }
          head_err() { head -c 180 "$1" 2>/dev/null | tr '\n\r' '  '; }
          # sha256 比对用的清单**在仓库里**（每个模型目录的 asset.json）⇒ 直链通道不需要任何元数据接口
          sha_ok() {  # $1=目录 $2=文件名
            python3 -c "import hashlib,json,sys;d=sys.argv;w=json.load(open(d[1]+'/asset.json',encoding='utf-8'))['sha256'].get(d[2]);f=open(d[1]+'/'+d[2],'rb');g=hashlib.file_digest(f,'sha256').hexdigest();f.close();sys.exit(0 if w and w==g else 1)" "$1" "$2"
          }
          dl_direct() {  # $1=目录 $2=文件名 → github.com 直链 + 当场 sha256 比对，成功 rc0
            local dest="$1" name="$2" code try
            for try in 1 2 3; do
              code="$(curl -sSL -4 --http1.1 --retry 3 --retry-delay 5 --retry-all-errors \
                          --max-time 1200 -o "$dest/$name" -w "%{http_code}" \
                          -H "Authorization: Bearer $GH_TOKEN" "$TAGURL/$name" 2>/tmp/dc.err)"
              if [ "$code" = 200 ] && sha_ok "$dest" "$name"; then
                note "fetched $name via 直链+sha256 (try=$try)"; return 0
              fi
              warn "$name 直链 try=$try http=$code sha=不符/缺 err=$(head_err /tmp/dc.err)"
              rm -f "$dest/$name"; sleep 5
            done
            return 1
          }
          note "diag curl=$(curl --version | head -1 | cut -d' ' -f1-2) gh=$(gh --version | head -1 | cut -d' ' -f1-3)"

          # ---------------- 元数据：四条通道，顺序尝试，全败才 90
          json=""
          meta_via=""
          if json="$($CUR --max-time 60 -H "Authorization: Bearer $GH_TOKEN" \
                        -H "Accept: application/vnd.github+json" \
                        "$API/releases/tags/model-assets" 2>/tmp/m1.err)"; then
            meta_via="ch1 api/tags + curl(http1.1)"
          else
            rc=$?; warn "meta ch1 rc=$rc err=$(head_err /tmp/m1.err)"
          fi
          if [ -z "$meta_via" ]; then
            # ch2：列表端点（draft release 用 tags 端点本就可能 404/异常，列表更稳）
            if json="$($CUR --max-time 60 -H "Authorization: Bearer $GH_TOKEN" \
                          -H "Accept: application/vnd.github+json" \
                          "$API/releases?per_page=100" 2>/tmp/m2.err \
                        | python3 -c "import sys,json;d=json.load(sys.stdin);print(json.dumps(next(r for r in d if r['tag_name']=='model-assets')))")"; then
              meta_via="ch2 api/list + curl(http1.1)"
            else
              rc=$?; warn "meta ch2 rc=$rc err=$(head_err /tmp/m2.err)"
            fi
          fi
          if [ -z "$meta_via" ]; then
            if json="$(gh api -H "Accept: application/vnd.github+json" \
                          "repos/$GITHUB_REPOSITORY/releases/tags/model-assets" 2>/tmp/m3.err)"; then
              meta_via="ch3 api/tags + gh"
            else
              rc=$?; warn "meta ch3 rc=$rc err=$(head_err /tmp/m3.err)"
            fi
          fi
          if [ -z "$meta_via" ]; then
            if json="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" 2>/tmp/m4.err \
                          | python3 -c "import sys,json;d=json.load(sys.stdin);print(json.dumps(next(r for r in d if r['tag_name']=='model-assets')))")"; then
              meta_via="ch4 api/list + gh"
            else
              rc=$?; warn "meta ch4 rc=$rc err=$(head_err /tmp/m4.err)"
            fi
          fi
          if [ -z "$meta_via" ]; then
            # 元数据全灭 **不等于** 这步该死：资产本体可以走 github.com 直链，完整性由仓库里的
            # asset.json sha256 当场判 ⇒ 这条通道与 api.github.com 无任何关系。
            p6="$(curl -sS -o /dev/null -6 --http1.1 --max-time 20 -w 'code=%{http_code} ip=%{remote_ip} t=%{time_total}' https://api.github.com/ 2>&1 | head -c 140 | tr '\n\r' '  ')"
            p4="$(curl -sS -o /dev/null -4 --http1.1 --max-time 20 -w 'code=%{http_code} ip=%{remote_ip} t=%{time_total}' https://api.github.com/ 2>&1 | head -c 140 | tr '\n\r' '  ')"
            warn "api.github.com 路由对照 -6[$p6] -4[$p4]（token 长度=${#GH_TOKEN} repo=$GITHUB_REPOSITORY）"
            warn "元数据四通道全失败 ⇒ 改走「github.com 直链 + 仓库内 asset.json sha256」"
            mkdir -p "$M/dinov2_cls_patch" "$M/isc_ft_v107"
            dead=0
            dl_direct "$M/dinov2_cls_patch" dinov2_cls_patch.onnx.data || dead=1
            dl_direct "$M/isc_ft_v107" isc_ft_v107.onnx || dead=1
            dl_direct "$M/isc_ft_v107" isc_ft_v107.onnx.data || dead=1
            if [ "$dead" != 0 ]; then
              echo "::error::model-assets 元数据四通道 + 直链兜底都没补齐（详见上面的 rc/http_code 注解）"
              exit 90
            fi
            python3 mvp/scripts/verify_model_asset_shas.py "$M/dinov2_cls_patch" "$M/isc_ft_v107"
            note "资产由直链兜底通道补齐，sha 校验已过（元数据接口整轮没用到）"
            exit 0
          fi
          note "meta OK via $meta_via ($(printf '%s' "$json" | wc -c | tr -d ' ') B)"

          fetch() {
            name="$1"; dest="$2"
            meta="$(printf '%s' "$json" | python3 -c "import sys,json;a=json.load(sys.stdin)['assets'];x=next(v for v in a if v['name']=='$name');print(x['id'],x['size'])")"
            aid="${meta%% *}"; asize="${meta##* }"
            mkdir -p "$dest"
            # 三条通道 × 3 轮：A=API octet-stream（历史用过）B=gh api octet-stream
            # C=github.com 直链（不依赖任何元数据；draft 资产能否直取未证 ⇒ 把 http_code 打进注解）
            # 完成判据一律是**与元数据 size 逐字节等值**（旧口径 >0 ⇒ 半件能过闸，错误要等
            # verify_model_asset_shas 才暴露，那 19 分钟已经花掉了）。
            chk() { [ "$(wc -c < "$1" 2>/dev/null | tr -d ' ')" = "$asize" ]; }
            for try in 1 2 3; do
              rc=0
              $CUR --speed-time 120 --speed-limit 20000 --max-time 1200 \
                   -H "Authorization: Bearer $GH_TOKEN" \
                   -H "Accept: application/octet-stream" \
                   -o "$dest/$name" "$API/releases/assets/$aid" 2>/tmp/a1.err || rc=$?
              if [ "$rc" = 0 ] && chk "$dest/$name"; then
                note "fetched $name via A ($asize B, aid=$aid, try=$try)"; return 0
              fi
              warn "$name A rc=$rc size=$(wc -c < "$dest/$name" 2>/dev/null | tr -d ' ')/$asize err=$(head_err /tmp/a1.err)"
              grc=0
              gh api -H "Accept: application/octet-stream" \
                     "repos/$GITHUB_REPOSITORY/releases/assets/$aid" > "$dest/$name" 2>/tmp/a2.err || grc=$?
              if [ "$grc" = 0 ] && chk "$dest/$name"; then
                note "fetched $name via B ($asize B, try=$try)"; return 0
              fi
              warn "$name B rc=$grc size=$(wc -c < "$dest/$name" 2>/dev/null | tr -d ' ')/$asize err=$(head_err /tmp/a2.err)"
              code="$(curl -sSL -4 --http1.1 --retry 3 --retry-delay 5 --retry-all-errors \
                          -o "$dest/$name" -w "%{http_code}" --max-time 1200 \
                          -H "Authorization: Bearer $GH_TOKEN" "$TAGURL/$name" 2>/tmp/a3.err)"
              if [ "$code" = 200 ] && sha_ok "$dest" "$name"; then
                note "fetched $name via C 直链+sha256 (try=$try)"; return 0
              fi
              warn "$name C http=$code sha=不符/缺 size=$(wc -c < "$dest/$name" 2>/dev/null | tr -d ' ')/$asize err=$(head_err /tmp/a3.err)"
              rm -f "$dest/$name"; sleep 10
            done
            echo "::error::$name 三通道×3 轮都没拿到 $asize B（aid=$aid）"
            exit 91
          }
          fetch dinov2_cls_patch.onnx.data "$M/dinov2_cls_patch"
          fetch isc_ft_v107.onnx "$M/isc_ft_v107"
          fetch isc_ft_v107.onnx.data "$M/isc_ft_v107"
          python3 mvp/scripts/verify_model_asset_shas.py "$M/dinov2_cls_patch" "$M/isc_ft_v107"
      - name: Download DINOv2 weights
        run: |
          mkdir -p .cache/dinov2_weights
          W=.cache/dinov2_weights/dinov2_vits14_pretrain.pth
          if [ ! -f "$W" ]; then
            curl -fL --retry 3 -o "$W" "https://dl.fbaipublicfiles.com/dinov2/dinov2_vits14/dinov2_vits14_pretrain.pth"
          fi
          export SVL_DINOV2_WEIGHTS="$PWD/$W"
          echo "SVL_DINOV2_WEIGHTS=$PWD/$W" >> "$GITHUB_ENV"

      - name: Fetch media libs (static ffmpeg/ffprobe + libmediainfo)
        run: |
          # 勿用 brew 的 ffmpeg: 它是动态链接的, 只 copy 二进制进 app bundle 会在用户机上
          # dyld 失败 (Library not loaded: /opt/homebrew/Cellar/ffmpeg/*/lib/libavdevice.*.dylib)。
          # static_ffmpeg 提供自带全部依赖的静态构建, build_backend_mac.py 直接采用。
          python -c "import static_ffmpeg.run as r; f,p=r.get_or_fetch_platform_executables_else_raise(); print('ffmpeg :',f); print('ffprobe:',p)"
          # 剪映草稿导出: pyJianYingDraft -> pymediainfo, 后者在 macOS 不自带 dylib,
          # 需要系统 libmediainfo (build_backend_mac.py 会把它装配进 bundle)。
          brew install libmediainfo || brew install mediainfo
          ls -la /opt/homebrew/lib/libmediainfo*.dylib

      - name: Build backend bundle (PyInstaller onedir + static ffmpeg + weights)
        run: python mvp/scripts/build_backend_mac.py

      - name: Verify bundled media binaries are static (no Homebrew dylib deps)
        run: |
          # 防回归: 若 ffmpeg/ffprobe 又变回 Homebrew 动态链接版, 用户机上会
          # dyld: Library not loaded .../libavdevice.*.dylib 直接崩。
          for B in ffmpeg ffprobe; do
            F="mvp/ui/resources/backend/$B"
            echo "--- $B ---"
            otool -L "$F" | head -6
            if otool -L "$F" | grep -qE "/opt/homebrew|/usr/local/Cellar"; then
              echo "::error::$B still links Homebrew dylibs - must be a static build"
              exit 1
            fi
          done
          echo "OK: bundled ffmpeg/ffprobe have no Homebrew dylib dependencies"
          # 剪映草稿导出依赖: libmediainfo 必须随包(pymediainfo 从自身包目录加载它)
          test -f "mvp/ui/resources/backend/_internal/pymediainfo/libmediainfo.0.dylib" \
            || { echo "::error::bundled libmediainfo.0.dylib missing - 剪映草稿导出会失败"; exit 1; }
          echo "OK: bundled libmediainfo present for pymediainfo"

      # 精排/ISC 资产不入库（ISC 外部权重 209MB 超 GitHub 单文件 100MB 硬限；patch 的 .data
      # 88MB 虽在限内但同批处理）⇒ 从内部 tag `model-assets` 下载，并逐个按 asset.json 的
      # sha256 校验（下载完整性不能只看 curl 退出码）。缺任一份 ⇒ 后面「Accept packaged mac
      # bundle」的资产判据会红，publish 不放行。
      # 后果背景：这两份资产缺失时，包内 patch 精排会**静默**回退 CPU torch（Windows 实测
      # 整条慢 2.6~3.9×，当年瞒了两周）、ISC 第二意见整体跳过 ⇒ 结果与 Windows 包不同档。

      - name: Build UI + electron app (mac arm64 dir, unsigned)
        working-directory: mvp/ui
        env:
          # 打包发布必须连真实后端。显式注入, 不依赖 .env.production 是否被 checkout
          # (它曾被 .gitignore 排除, 导致 mac 包静默跑 Mock: 假"已连接" + 假日志)。
          VITE_BACKEND_MODE: http
          VITE_API_BASE: http://127.0.0.1:8765
        run: |
          npm ci
          npm run build
          npm run compile:electron
          npx electron-builder --mac --arm64 --dir

      - name: Ad-hoc codesign + ditto rezip (preserve symlinks)
        working-directory: mvp/ui
        run: |
          APP="release/mac-arm64/Video Locator.app"
          [ -d "$APP" ] || APP="$(find release -maxdepth 2 -name '*.app' -type d | head -1)"
          echo "signing app: $APP"
          [ -n "$APP" ] && [ -d "$APP" ] || { echo "no .app found under release/"; exit 1; }
          # 1) ad-hoc 签名整个 app（含 PyInstaller backend 与 Electron 二进制）
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP" && echo "ad-hoc codesign verify OK"
          # 2) ditto 打包 zip —— 保留符号链接/权限/xattr（7za/zip 会丢 Framework symlink → 解压即损坏）
          APPDIR="$(cd "$(dirname "$APP")" && pwd)"
          APPNAME="$(basename "$APP")"
          (cd "$APPDIR" && ditto -c -k --keepParent --sequesterRsrc "$APPNAME" "../Video-Locator-mac-arm64.zip")
          ls -la release/*.zip

      - name: Upload mac package artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-locator-mac-arm64
          path: mvp/ui/release/Video-Locator-mac-arm64.zip
          if-no-files-found: error

      # 包体内容验收（2026-10-06 续61 补五）：过去 mac 包只验到「构建成功 + 静态库依赖 +
      # ad-hoc 签名可验」，没做过一次包体实测（我们自己的纪律：源码全绿 ≠ 包能用）。
      # 判据 = 结构/资产 + 起包 + 门禁负例 + MPS 真被选中 + 合成素材端到端 + 中文路径。
      # FAILED>0 即本步失败 ⇒ 下面 publish 不执行（mac-alpha 不再"构建成功即对外发布"）。
      - name: Accept packaged mac bundle (gate publish)
        run: python mvp/scripts/accept_packaged_bundle_mac.py "mvp/ui/release/mac-arm64/Video Locator.app"

      - name: Publish to GitHub Releases (rolling tag mac-alpha)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Z="mvp/ui/release/Video-Locator-mac-arm64.zip"
          echo "publishing $Z"
          if gh release view mac-alpha > /dev/null 2>&1; then
            gh release upload mac-alpha "$Z" --clobber
          else
            gh release create mac-alpha "$Z"               --title "Video Locator - macOS (Apple Silicon) alpha"               --notes-file mvp/docs/MAC_RELEASE_NOTES.md               --prerelease
          fi


  # ---- 以下为原 POC job ----
  # ---- mac 安装包（unsigned zip）: 测试绿了才打包 ----
  # PyInstaller 打 mac arm64 后端（MPS）+ DINOv2 权重随包 + electron-builder zip。
  # 未签名: 下载后需 `xattr -cr Video\ Locator.app`（或右键打开）绕过 Gatekeeper。
  mps-poc:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Apple Silicon (arm64) runner
        shell: bash
        run: |
          echo "uname -m: $(uname -m)"
          echo "macOS: $(sw_vers -productVersion)"
          echo "machine: $(sysctl -n machdep.cpu.brand_string || true)"
          test "$(uname -m)" = "arm64" || {
            echo "::error::expected arm64 (Apple Silicon) runner, got $(uname -m)"
            exit 1
          }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "arm64"

      - name: Cache pip + DINOv2 weights
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/pip
            ${{ github.workspace }}/.cache/dinov2_weights
          key: h3-mps-cache-v1

      - name: Install deps (PyTorch w/ MPS, opencv, numpy, psutil)
        run: |
          python -m pip install --upgrade pip
          pip install torch opencv-python numpy psutil
          python -c "import torch; print('torch', torch.__version__, 'mps_built', torch.backends.mps.is_built(), 'mps_avail', torch.backends.mps.is_available())"

      - name: Run MPS POC
        run: |
          python mvp/poc/macos_mps/mps_poc.py \
            --weights-dir "${{ github.workspace }}/.cache/dinov2_weights" \
            --out mvp/poc/macos_mps/results.json

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: h3-mps-results
          path: |
            mvp/poc/macos_mps/results.json
            mvp/poc/macos_mps/results.md
          if-no-files-found: error

      - name: Publish results to repo (ci-results branch, no re-trigger)
        if: always()
        shell: bash
        run: |
          if [ ! -f mvp/poc/macos_mps/results.json ]; then
            echo "no results.json in this run; skipping publish"
            exit 0
          fi
          git config user.name "h3-ci"
          git config user.email "ci@gh-actions"
          git add mvp/poc/macos_mps/results.json mvp/poc/macos_mps/results.md
          git commit -q -m "h3: publish MPS results" --no-verify || echo "nothing to commit"
          # push to a NON-master branch so it does not re-trigger this workflow
          git push --force origin master:ci-results || echo "push to ci-results failed"
